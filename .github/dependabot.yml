version: 2
updates:
  # Enable version updates for npm (Bun project dependencies under documentation/)
  - package-ecosystem: "npm"
    directory: "/documentation"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Enable version updates for Cargo (Rust examples)
  - package-ecosystem: "cargo"
    directory: "/examples"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
