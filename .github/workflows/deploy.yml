name: CD - Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./documentation
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.2.0"

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('documentation/bun.lock') }}
          restore-keys: |
            bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build website
        run: bun run build
        env:
          # Sourced from GitHub Repository Secrets — never hardcode these values.
          # See DEPLOYMENT.md → Environment Variables for setup instructions.
          NEWSLETTER_ENDPOINT: ${{ secrets.NEWSLETTER_ENDPOINT }}
          DISCORD_INVITE_URL: ${{ secrets.DISCORD_INVITE_URL }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment Summary
        run: |
          echo "## ✅ Deployment Complete"
          echo ""
          echo "**Environment**: GitHub Pages"
          echo "**URL**: ${{ steps.deployment.outputs.page_url }}"
          echo "**Commit**: ${{ github.sha }}"
          echo "**Branch**: ${{ github.ref_name }}"

      # ── Deploy status notifications (success) ──────────────────────────────
      # Requires repository secrets (optional — steps no-op when unset):
      #   SLACK_WEBHOOK_URL, DISCORD_WEBHOOK_URL
      # See DEPLOYMENT.md → Deploy Status Notifications
      - name: Notify Slack on deploy success
        if: ${{ success() && secrets.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": ":rocket: *Deploy succeeded* — Soroban Cookbook is live on GitHub Pages",
              "attachments": [
                {
                  "color": "#36A64F",
                  "fields": [
                    {
                      "title": "URL",
                      "value": "${{ steps.deployment.outputs.page_url }}",
                      "short": false
                    },
                    {
                      "title": "Branch",
                      "value": "${{ github.ref_name }}",
                      "short": true
                    },
                    {
                      "title": "Triggered by",
                      "value": "${{ github.actor }}",
                      "short": true
                    },
                    {
                      "title": "Commit",
                      "value": "${{ github.sha }}",
                      "short": true
                    },
                    {
                      "title": "Run URL",
                      "value": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Notify Discord on deploy success
        if: ${{ success() && secrets.DISCORD_WEBHOOK_URL != '' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          payload=$(jq -n \
            --arg content "✅ **Deploy succeeded** — Soroban Cookbook is live on GitHub Pages" \
            --arg url "$PAGE_URL" \
            --arg branch "${{ github.ref_name }}" \
            --arg actor "${{ github.actor }}" \
            --arg sha "${{ github.sha }}" \
            --arg run "$RUN_URL" \
            '{
              content: $content,
              embeds: [{
                title: "Deployment Complete",
                color: 3590991,
                fields: [
                  {name: "URL", value: $url, inline: false},
                  {name: "Branch", value: $branch, inline: true},
                  {name: "Triggered by", value: $actor, inline: true},
                  {name: "Commit", value: $sha, inline: false},
                  {name: "Run URL", value: $run, inline: false}
                ]
              }]
            }')
          curl -sS -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$payload"

  # Alert when build or deploy fails (success path notifies from the deploy job)
  notify-failure:
    name: Notify on deploy failure
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: always() && (needs.build.result == 'failure' || needs.deploy.result == 'failure' || needs.build.result == 'cancelled' || needs.deploy.result == 'cancelled')
    steps:
      - name: Determine failure source
        id: meta
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "stage=build" >> "$GITHUB_OUTPUT"
            echo "result=${{ needs.build.result }}" >> "$GITHUB_OUTPUT"
          else
            echo "stage=deploy" >> "$GITHUB_OUTPUT"
            echo "result=${{ needs.deploy.result }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Slack on deploy failure
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": ":red_circle: *Deploy ${{ steps.meta.outputs.result }}* — `${{ steps.meta.outputs.stage }}` on `${{ github.ref_name }}`",
              "attachments": [
                {
                  "color": "#FF0000",
                  "fields": [
                    {
                      "title": "Failed stage",
                      "value": "${{ steps.meta.outputs.stage }}",
                      "short": true
                    },
                    {
                      "title": "Result",
                      "value": "${{ steps.meta.outputs.result }}",
                      "short": true
                    },
                    {
                      "title": "Branch",
                      "value": "${{ github.ref_name }}",
                      "short": true
                    },
                    {
                      "title": "Triggered by",
                      "value": "${{ github.actor }}",
                      "short": true
                    },
                    {
                      "title": "Commit",
                      "value": "${{ github.sha }}",
                      "short": true
                    },
                    {
                      "title": "Run URL",
                      "value": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Notify Discord on deploy failure
        if: ${{ secrets.DISCORD_WEBHOOK_URL != '' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          payload=$(jq -n \
            --arg content "🔴 **Deploy ${{ steps.meta.outputs.result }}** — \`${{ steps.meta.outputs.stage }}\` on \`${{ github.ref_name }}\`" \
            --arg stage "${{ steps.meta.outputs.stage }}" \
            --arg result "${{ steps.meta.outputs.result }}" \
            --arg branch "${{ github.ref_name }}" \
            --arg actor "${{ github.actor }}" \
            --arg sha "${{ github.sha }}" \
            --arg run "$RUN_URL" \
            '{
              content: $content,
              embeds: [{
                title: "Deployment Failed",
                color: 16711680,
                fields: [
                  {name: "Failed stage", value: $stage, inline: true},
                  {name: "Result", value: $result, inline: true},
                  {name: "Branch", value: $branch, inline: true},
                  {name: "Triggered by", value: $actor, inline: true},
                  {name: "Commit", value: $sha, inline: false},
                  {name: "Run URL", value: $run, inline: false}
                ]
              }]
            }')
          curl -sS -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$payload"

      - name: Confirm (no webhooks configured)
        if: ${{ secrets.SLACK_WEBHOOK_URL == '' && secrets.DISCORD_WEBHOOK_URL == '' }}
        run: |
          echo "⚠️  No deploy notification webhooks configured."
          echo "Add SLACK_WEBHOOK_URL and/or DISCORD_WEBHOOK_URL under Settings → Secrets → Actions."
          echo "See DEPLOYMENT.md → Deploy Status Notifications."
          # Do not fail the notify job — missing optional secrets must not block visibility of the deploy failure itself.
          exit 0
