name: CD - Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./documentation
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.2.0"

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('documentation/bun.lock') }}
          restore-keys: |
            bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build website
        run: bun run build
        env:
          # Sourced from GitHub Repository Secrets — never hardcode these values.
          # See DEPLOYMENT.md → Environment Variables for setup instructions.
          SITE_URL: ${{ github.ref_name == 'main' && 'https://soroban-cookbook.dev' || 'https://staging.soroban-cookbook.dev' }}
          NEWSLETTER_ENDPOINT: ${{ secrets.NEWSLETTER_ENDPOINT }}
          DISCORD_INVITE_URL: ${{ secrets.DISCORD_INVITE_URL }}
          # Analytics stays disabled until these are set — see DEPLOYMENT.md → Analytics.
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
          CLARITY_PROJECT_ID: ${{ secrets.CLARITY_PROJECT_ID }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  deploy:
    if: github.ref_name == 'main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment Summary
        run: |
          echo "## ✅ Deployment Complete"
          echo ""
          echo "**Environment**: Production (GitHub Pages)"
          echo "**URL**: ${{ steps.deployment.outputs.page_url }}"
          echo "**Commit**: ${{ github.sha }}"
          echo "**Branch**: ${{ github.ref_name }}"

  deploy-staging:
    if: github.ref_name == 'staging'
    environment:
      name: staging
      url: https://staging.soroban-cookbook.dev
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: ./build-artifact

      - name: Extract Build Artifact
        run: |
          mkdir -p ./build
          tar -xf ./build-artifact/artifact.tar -C ./build

      - name: Deploy Staging to gh-pages-staging branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          publish_branch: gh-pages-staging
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

      - name: Deployment Summary
        run: |
          echo "## ✅ Deployment Complete"
          echo ""
          echo "**Environment**: Staging"
          echo "**Branch**: gh-pages-staging"
          echo "**URL**: https://staging.soroban-cookbook.dev"
          echo "**Commit**: ${{ github.sha }}"
