name: Deploy PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./documentation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Format, Lint, Typecheck, and Build
        run: bun run format:check && bun run lint && bun run typecheck && bun run build

      - name: Deploy PR Preview
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./documentation/build
          action: auto

      - name: Skip preview deploy for fork PRs
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "Build succeeded."
          echo "Skipping gh-pages preview deploy for fork PR (GITHUB_TOKEN cannot push to upstream)."