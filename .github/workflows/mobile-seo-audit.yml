name: Mobile-First Indexing Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  mobile-seo-audit:
    name: Mobile SEO & Lighthouse Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./documentation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        # React 19 is in use; @testing-library/react@14 still peers React 18.
        run: npm ci --legacy-peer-deps

      - name: Build documentation
        run: npm run build

      - name: Serve & Audit with Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.14.x
          lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: ./documentation/.lighthouseci/
          retention-days: 5

  mobile-friendly-check:
    name: Mobile-Friendly Verification
    runs-on: ubuntu-latest
    needs: mobile-seo-audit
    defaults:
      run:
        working-directory: ./documentation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build documentation
        run: npm run build

      - name: Check viewport meta tag
        run: |
          if grep -r 'name="viewport"' build/; then
            echo "✅ Viewport meta tag found"
          else
            echo "❌ Viewport meta tag missing"
            exit 1
          fi

      - name: Check font-size minimum
        run: |
          # Lighthouse CI enforces font-size; keep an explicit confirmation step.
          echo "✅ Font size check delegated to Lighthouse audit"

      - name: Check tap target sizes
        run: |
          # Touch-target sizing lives in mobile-menu.css (44px+) and button tokens (48px).
          if grep -qE 'min-height:\s*44px|min-height:\s*48px|--btn-height-lg:\s*48px' src/css/mobile-menu.css src/components/buttons/buttons.module.css; then
            echo "✅ Touch target CSS utilities found"
          else
            echo "❌ Touch target CSS utilities missing"
            exit 1
          fi